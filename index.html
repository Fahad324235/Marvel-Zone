<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Zone</title>
    <style>
        :root {
            --primary-color: #e62429; 
            --bg-color: #0f171e;
            --card-bg: #1a242f;
            --text-main: #ffffff;
            --accent-color: #00d2ff;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            background: radial-gradient(circle at top, #1e2a38 0%, #0f171e 100%);
        }

        /* --- Header & Video Player --- */
        .video-player {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .video-container {
            position: relative;
            max-width: 750px;
            margin: 0 auto;
            border-radius: 1px;
            overflow: hidden;
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(230, 36, 41, 0.4);
            background: #000;
            aspect-ratio: 16 / 9; /* پلیئر کا سائز فکس رکھنے کے لیے */
        }

        /* پلیئر اسٹائلنگ */
        #mainPlayer, #directVideoPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* شروع میں چھپا ہوا */
        }

        .video-title {
            margin-top: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        /* --- Thumbnail Grid --- */
        .thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            padding: 30px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .thumbnail {
            background: var(--card-bg);
            border-radius: 1px;
            overflow: hidden;
            transition: 0.3s;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .thumbnail:hover {
            transform: translateY(-8px);
            border-color: var(--primary-color);
        }

        .thumbnail img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .thumbnail-info {
            padding: 12px;
            text-align: center;
        }

        .movie-number {
            position: absolute;
            top: 8px;
            left: 8px;
            background: var(--primary-color);
            color: #fff;
            padding: 3px 8px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
            z-index: 2;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 18px;
            background: linear-gradient(45deg, #e62429, #ff5f6d);
            color: white !important;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px 0;
        }

        .pagination button {
            padding: 10px 20px;
            background: var(--card-bg);
            color: white;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button:disabled { opacity: 0.3; }

        /* --- Overlay (Ad) --- */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        
        .overlay-content {
            width: 100%;
            height: 100%;
            position: relative;
            background: #000;
        }

        .timer-display {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary-color);
            color: white;
            padding: 10px 20px;
            font-family: sans-serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 1px;
            z-index: 2001;
            box-shadow: 0 0 20px rgba(230, 36, 41, 0.6);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    </style>
</head>

    const thumbnailsPerPage = 12;
    let currentPage = 1;

    function displayThumbnails() {
        const container = document.getElementById('thumbnailsContainer');
        container.innerHTML = '';
        const start = (currentPage - 1) * thumbnailsPerPage;
        const end = start + thumbnailsPerPage;
        const thumbnailsToShow = thumbnailsData.slice(start, end);

        thumbnailsToShow.forEach((thumbnail, index) => {
            const div = document.createElement('div');
            div.className = 'thumbnail';
            div.onclick = () => playVideo(thumbnail.url, thumbnail.title);
            
            div.innerHTML = `
                <span class="movie-number">#${thumbnailsData.length - (start + index)}</span>
                <img src="${thumbnail.img}" alt="${thumbnail.title}" loading="lazy">
                <div class="thumbnail-info">
                    <p style="font-size: 13px; height: 35px;">${thumbnail.title}</p>
                    <a href="javascript:void(0)" class="download-btn" onclick="event.stopPropagation(); openOverlay();">Download</a>
                </div>
            `;
            container.appendChild(div);
        });

        document.getElementById('prevPage').disabled = currentPage === 1;
        document.getElementById('nextPage').disabled = end >= thumbnailsData.length;
    }

    function changePage(direction) {
        currentPage += direction;
        displayThumbnails();
        window.scrollTo({top: document.querySelector('.thumbnails').offsetTop - 150, behavior: 'smooth'});
    }

    function playVideo(url, title) {
        const iframePlayer = document.getElementById('mainPlayer');
        const videoPlayer = document.getElementById('directVideoPlayer');
        const videoSource = document.getElementById('videoSource');
        const loading = document.getElementById('loading');

        // دونوں پلیئرز کو صاف اور چھپا دیں
        iframePlayer.style.display = 'none';
        videoPlayer.style.display = 'none';
        iframePlayer.src = '';
        videoPlayer.pause();

        loading.style.display = 'block';

        setTimeout(() => {
            loading.style.display = 'none';
            document.getElementById('videoTitle').textContent = title;

            // اسمارٹ چیک: کیا یہ ڈائریکٹ لنک ہے؟ (mp4, mkv, r2.dev یا ٹوکن والے لنکس)
            if (url.includes('.mp4') || url.includes('.mkv') || url.includes('r2.dev') || url.includes('token=')) {
                videoSource.src = url;
                videoPlayer.load();
                videoPlayer.style.display = 'block';
                videoPlayer.play();
            } else {
                // گوگل ڈرائیو یا آئی فریم والے لنکس
                iframePlayer.src = url;
                iframePlayer.style.display = 'block';
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }, 600);
    }

    function openOverlay() {
        const overlay = document.getElementById('overlay');
        const timerDisplay = document.getElementById('timer');
        const iframe = document.getElementById('overlayIframe');
        let timeLeft = 20;

        iframe.src = getRandomAd();
        overlay.style.display = 'flex';

        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = ` ${timeLeft}`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                closeOverlay();
            }
        }, 1000);
    }

    function closeOverlay() {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('overlayIframe').src = '';
    }

    window.onload = function() {
        displayThumbnails();
        setTimeout(() => {
            openOverlay();
        }, 1500);
    };
    
</script>
